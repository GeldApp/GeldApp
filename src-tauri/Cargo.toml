[package]
name = "geldapp"
version = "0.1.0"
description = "A calmer kind of banking"
authors = ["GeldApp"]
edition = "2021"

[lib]
name = "geldapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
