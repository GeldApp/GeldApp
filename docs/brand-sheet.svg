<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">GeldApp visual identity</title>
  <desc id="description">Navy, ink and warm gold brand sheet with the GeldApp G mark and color palette.</desc>
  <rect width="1400" height="900" fill="#f5f6f7"/>
  <rect x="70" y="70" width="1260" height="760" rx="26" fill="#fff"/>
  <rect x="110" y="110" width="1180" height="420" rx="18" fill="#123b73"/>
  <svg x="154" y="154" width="228" height="228" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="#123B73"/>
    <path d="M31.9 18.2a10 10 0 1 0 1.3 10.1h-9.1v-5.2h15.6v3.1c0 9.1-6.5 15.3-15.8 15.3C13.7 41.5 6 33.9 6 24S13.7 6.5 23.9 6.5c6.6 0 11.7 3 14.4 8.1l-5.4 3.6a9.5 9.5 0 0 0-1-0Z" fill="#F2C76D" transform="translate(3 -1) scale(.88)"/>
  </svg>
  <text x="438" y="288" fill="#f5f6f7" font-family="Manrope, 'DM Sans', sans-serif" font-size="76" font-weight="700" letter-spacing="-4">GeldApp</text>
  <text x="441" y="336" fill="#d7e2f0" font-family="'DM Sans', sans-serif" font-size="19" letter-spacing="3">CLARITY FOR EVERYDAY FINANCES</text>
  <text x="112" y="602" fill="#172536" font-family="Manrope, 'DM Sans', sans-serif" font-size="25" font-weight="700">Color system</text>
  <g font-family="'DM Sans', sans-serif" font-size="15" fill="#172536">
    <rect x="112" y="640" width="184" height="84" rx="10" fill="#123b73"/><text x="112" y="754">Navy · #123B73</text>
    <rect x="330" y="640" width="184" height="84" rx="10" fill="#f5f6f7" stroke="#dfe4ea"/><text x="330" y="754">Ivory gray · #F5F6F7</text>
    <rect x="548" y="640" width="184" height="84" rx="10" fill="#efc76f"/><text x="548" y="754">Gold · #EFC76F</text>
    <rect x="766" y="640" width="184" height="84" rx="10" fill="#172536"/><text x="766" y="754">Ink · #172536</text>
    <rect x="984" y="640" width="184" height="84" rx="10" fill="#e6ecf4"/><text x="984" y="754">Pale blue · #E6ECF4</text>
