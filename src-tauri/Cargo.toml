[package]
name = "geldapp"
version = "0.1.0"
description = "A calmer kind of banking"
authors = ["GeldApp"]
edition = "2021"

[lib]
name = "geldapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
biometry-integration = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.6"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.23"
fs2 = "0.4"
tauri-plugin-wdio-webdriver = { version = "2.0.0-next.0", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
