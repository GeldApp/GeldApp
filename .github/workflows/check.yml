name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test

  native-macos:
    name: Native (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Lint GitHub Actions workflows
        run: |
          brew install actionlint
          actionlint .github/workflows/*.yml

      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Compile Tauri application
        run: npm run tauri -- build --debug --no-bundle --ci
      - name: Build isolated native vault smoke application
        run: npm run native:e2e:build
      - name: Create and lock synthetic native vault
        run: npm run native:e2e:setup
        env:
          GELDAPP_E2E_DATA_DIR: ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
          GELDAPP_E2E_LOG_DIR: ${{ runner.temp }}/geldapp-wdio-e2e-logs
      - name: Restart app and verify passphrase behavior
        run: npm run native:e2e:reopen
        env:
          GELDAPP_E2E_DATA_DIR: ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
          GELDAPP_E2E_LOG_DIR: ${{ runner.temp }}/geldapp-wdio-e2e-logs
      - name: Corrupt synthetic current snapshot and recover previous snapshot
        run: npm run native:e2e:recovery
        env:
          GELDAPP_E2E_DATA_DIR: ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
          GELDAPP_E2E_LOG_DIR: ${{ runner.temp }}/geldapp-wdio-e2e-logs
      - name: Preserve synthetic native E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-e2e-macos-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
            ${{ runner.temp }}/geldapp-wdio-e2e-logs
          if-no-files-found: warn
          retention-days: 14
  native-windows:
    name: Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Compile Tauri application
        run: npm run tauri -- build --debug --no-bundle --ci
      - name: Build isolated native vault smoke application
        run: npm run native:e2e:build
      - name: Create and lock synthetic native vault
        run: npm run native:e2e:setup
        env:
          GELDAPP_E2E_DATA_DIR: ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
          GELDAPP_E2E_LOG_DIR: ${{ runner.temp }}/geldapp-wdio-e2e-logs
      - name: Restart app and verify passphrase behavior
        run: npm run native:e2e:reopen
        env:
          GELDAPP_E2E_DATA_DIR: ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
          GELDAPP_E2E_LOG_DIR: ${{ runner.temp }}/geldapp-wdio-e2e-logs
      - name: Corrupt synthetic current snapshot and recover previous snapshot
        run: npm run native:e2e:recovery
        env:
          GELDAPP_E2E_DATA_DIR: ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
          GELDAPP_E2E_LOG_DIR: ${{ runner.temp }}/geldapp-wdio-e2e-logs
      - name: Preserve synthetic native E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-e2e-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/geldapp-e2e-${{ github.run_id }}
            ${{ runner.temp }}/geldapp-wdio-e2e-logs
          if-no-files-found: warn
          retention-days: 14
