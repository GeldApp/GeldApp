name: Release draft

on:
  push:
    branches: [main]

permissions:
  contents: read

# Only one release-draft writer at a time. If main advances during a run, GitHub
# keeps the newest pending run, which converges the draft to the latest main.
concurrency:
  group: release-draft-main
  cancel-in-progress: false

jobs:
  update:
    name: Update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate next version from Conventional Commits
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: v
          major_pattern: '/^[a-z]+(?:\([^)]+\))?!:|(?:^|\n)BREAKING[- ]CHANGE:/'
          minor_pattern: '/^feat(?:\([^)]+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: true
          enable_prerelease_mode: false

      - name: Create or update draft release
        uses: release-drafter/release-drafter@v7.10.0
        with:
          version: ${{ steps.version.outputs.version }}
          commitish: main
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
